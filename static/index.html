<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segundo Cerebro</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{--bg:#0d0d0f;--surface:#141416;--surface2:#1c1c1f;--border:#2a2a2f;--accent:#7c6af7;--accent2:#a78bfa;--text:#e8e8ed;--text-dim:#8a8a96;--text-faint:#4a4a54;--user-bg:#1e1e28;--tag-obs:#1a2540;--tag-zot:#1f1535;--success:#22c55e;--radius:14px;--sidebar-w:280px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow-y:auto;}
#sidebar-header{padding:1.2rem 1.2rem 1rem;border-bottom:1px solid var(--border);}
#sidebar-header h1{font-size:1rem;font-weight:600;color:var(--text);display:flex;align-items:center;gap:0.5rem;}
.sidebar-section{padding:1rem 1.2rem;border-bottom:1px solid var(--border);}
.sidebar-section.grow{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.sidebar-label{font-size:0.68rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:0.6rem;}
#carpeta-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.7rem;color:var(--text);font-family:'Sora',sans-serif;font-size:0.82rem;outline:none;cursor:pointer;}
#prompt-editor{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.7rem;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:0.73rem;line-height:1.5;outline:none;resize:vertical;min-height:140px;max-height:260px;}
#btn-save-prompt{margin-top:0.5rem;width:100%;background:var(--accent);color:white;border:none;border-radius:8px;padding:0.45rem;font-family:'Sora',sans-serif;font-size:0.8rem;font-weight:500;cursor:pointer;}
#prompt-status{font-size:0.72rem;color:var(--success);text-align:center;margin-top:0.3rem;height:1rem;}
#stats{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:0.55rem;}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;}
.stat-label{color:var(--text-dim);}.stat-val{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--accent2);font-weight:500;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:5px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
#chat{flex:1;overflow-y:auto;padding:2rem 0;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.msg-wrapper{width:100%;max-width:780px;margin:0 auto;padding:0 1.5rem;animation:fadeUp 0.25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-wrapper+.msg-wrapper{margin-top:1.5rem;}
.msg-role{font-size:0.7rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.4rem;color:var(--text-faint);}
.msg-role.user-role{color:var(--accent2);}
.msg-body{padding:1rem 1.2rem;border-radius:var(--radius);line-height:1.7;font-size:0.92rem;}
.msg-body.user{background:var(--user-bg);border:1px solid #2a2a40;}
.msg-body.bot{background:transparent;border:none;padding-left:0;padding-right:0;}
.msg-body.pensando{color:var(--text-dim);font-style:italic;display:flex;align-items:center;gap:0.6rem;}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.msg-body.bot h1,.msg-body.bot h2,.msg-body.bot h3{color:var(--text);margin:1rem 0 0.4rem;font-weight:600;}
.msg-body.bot p{margin-bottom:0.6rem;}.msg-body.bot ul,.msg-body.bot ol{padding-left:1.4rem;margin-bottom:0.6rem;}
.msg-body.bot li{margin-bottom:0.25rem;}.msg-body.bot strong{color:var(--text);font-weight:600;}.msg-body.bot em{color:var(--accent2);}
.msg-body.bot code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0.1rem 0.35rem;font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:#a8d8a8;}
.msg-body.bot pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1rem;overflow-x:auto;margin:0.6rem 0;}
.msg-body.bot pre code{background:none;border:none;padding:0;}
.msg-body.bot blockquote{border-left:3px solid var(--accent);padding-left:1rem;color:var(--text-dim);margin:0.6rem 0;}
.msg-body.bot table{width:100%;border-collapse:collapse;margin:0.6rem 0;font-size:0.85rem;}
.msg-body.bot th{background:var(--surface2);padding:0.5rem 0.8rem;text-align:left;border:1px solid var(--border);font-weight:600;}
.msg-body.bot td{padding:0.5rem 0.8rem;border:1px solid var(--border);}
.msg-body.bot tr:nth-child(even) td{background:#141416;}
.fuentes{margin-top:0.7rem;display:flex;flex-wrap:wrap;gap:0.35rem;}
.fuente-tag{font-size:0.68rem;font-family:'JetBrains Mono',monospace;padding:0.2rem 0.55rem;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;cursor:default;}
.fuente-obsidian{background:var(--tag-obs);border:1px solid #2a3a6a;color:#88aaff;}
.fuente-zotero{background:var(--tag-zot);border:1px solid #4a2a7a;color:#cc99ff;}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:2rem;overflow-y:auto;}
#welcome h2{font-size:1.6rem;font-weight:300;color:var(--text-dim);text-align:center;}
#welcome h2 strong{color:var(--text);font-weight:600;}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;max-width:600px;width:100%;}
.suggestion-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.85rem 1rem;color:var(--text-dim);font-family:'Sora',sans-serif;font-size:0.82rem;line-height:1.4;cursor:pointer;text-align:left;transition:all 0.2s;}
.suggestion-btn:hover{border-color:var(--accent);color:var(--text);background:var(--surface2);}
.suggestion-icon{display:block;font-size:1.1rem;margin-bottom:0.3rem;}
#input-area{padding:1rem 1.5rem 1.3rem;max-width:780px;width:100%;margin:0 auto;}
#input-box{display:flex;align-items:flex-end;gap:0.6rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.7rem 0.7rem 0.7rem 1rem;transition:border-color 0.2s;}
#input-box:focus-within{border-color:var(--accent);}
#input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Sora',sans-serif;font-size:0.92rem;line-height:1.5;outline:none;resize:none;max-height:160px;overflow-y:auto;}
#input::placeholder{color:var(--text-faint);}
#btn-send{background:var(--accent);color:white;border:none;border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:opacity 0.2s,transform 0.1s;}
#btn-send:hover{opacity:0.85;}#btn-send:active{transform:scale(0.95);}#btn-send:disabled{opacity:0.3;cursor:not-allowed;}
#btn-send svg{width:15px;height:15px;}
#input-hint{font-size:0.68rem;color:var(--text-faint);text-align:center;margin-top:0.5rem;}
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header"><h1>&#x1F9E0; Segundo Cerebro</h1></div>
  <div class="sidebar-section">
    <div class="sidebar-label">Carpeta</div>
    <select id="carpeta-select"><option value="">Todas las carpetas</option></select>
  </div>
  <div class="sidebar-section grow">
    <div class="sidebar-label">Personalidad del asistente</div>
    <textarea id="prompt-editor" spellcheck="false">Eres un asesor academico experto y proactivo que ayuda al usuario a desarrollar su tesis. Tienes acceso a sus notas de Obsidian y papers de Zotero.

Tu estilo:
- Directo y tecnico, sin relleno
- Siempre sugieres conexiones entre notas y papers que el usuario quizas no vio
- Identificas vacios en la investigacion y los señalas
- Propones preguntas de investigacion concretas
- Cuando citas un paper de Zotero, incluyes autores y año
- Cuando usas una nota de Obsidian, mencionas su nombre
- Si hay contradiccion entre fuentes, lo señalas explicitamente
- Al final de cada respuesta, sugieres 1-2 preguntas de seguimiento relevantes</textarea>
    <button id="btn-save-prompt">Guardar cambios</button>
    <div id="prompt-status"></div>
  </div>
  <div id="stats">
    <div class="sidebar-label">Estado</div>
    <div class="stat-row"><span class="stat-label"><span class="dot"></span>API</span><span class="stat-val" id="stat-api">&#x2014;</span></div>
    <div class="stat-row"><span class="stat-label">Notas indexadas</span><span class="stat-val" id="stat-notas">&#x2014;</span></div>
    <div class="stat-row"><span class="stat-label">Papers en Zotero</span><span class="stat-val" id="stat-zotero">&#x2014;</span></div>
  </div>
</div>
<div id="main">
  <div id="welcome">
    <h2>Hola, <strong>Heisser</strong>.<br>&#xBF;En que trabajamos hoy?</h2>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="usarSugerencia(this)"><span class="suggestion-icon">&#x1F50D;</span>&#xBF;Que vacios teoricos hay en mis notas sobre diversidad funcional?</button>
      <button class="suggestion-btn" onclick="usarSugerencia(this)"><span class="suggestion-icon">&#x1F4CA;</span>Ayudame a estructurar el capitulo de resultados de mi tesis</button>
      <button class="suggestion-btn" onclick="usarSugerencia(this)"><span class="suggestion-icon">&#x1F99F;</span>&#xBF;Que dice la literatura sobre fauna del suelo en agroforesteria?</button>
      <button class="suggestion-btn" onclick="usarSugerencia(this)"><span class="suggestion-icon">&#x1F517;</span>Conecta mis notas de cacao con los papers de Zotero disponibles</button>
    </div>
  </div>
  <div id="chat" style="display:none;"></div>
  <div id="input-area">
    <div id="input-box">
      <textarea id="input" rows="1" placeholder="Pregunta algo sobre tus notas y papers..."></textarea>
      <button id="btn-send" title="Enviar (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div id="input-hint">Enter para enviar · Shift+Enter para nueva linea</div>
  </div>
</div>
<script>
const chat=document.getElementById('chat');
const welcome=document.getElementById('welcome');
const input=document.getElementById('input');
const btn=document.getElementById('btn-send');
const selectCarpeta=document.getElementById('carpeta-select');
const promptEditor=document.getElementById('prompt-editor');
const btnSave=document.getElementById('btn-save-prompt');
const promptStatus=document.getElementById('prompt-status');
let systemPrompt=promptEditor.value;
let historial=[];
let primeraVez=true;
marked.setOptions({breaks:true,gfm:true});
async function checkHealth(){
  try{const r=await fetch('/health');const d=await r.json();
    document.getElementById('stat-api').textContent='online';
    document.getElementById('stat-api').style.color='#22c55e';
    document.getElementById('stat-notas').textContent=d.notas_indexadas??'--';
  }catch{document.getElementById('stat-api').textContent='offline';document.getElementById('stat-api').style.color='#ef4444';}
  try{const z=await fetch('/zotero/count');const zd=await z.json();
    document.getElementById('stat-zotero').textContent=zd.total??'--';
  }catch{document.getElementById('stat-zotero').textContent='--';}
}
fetch('/carpetas').then(r=>r.json()).then(data=>{
  (data.carpetas||[]).forEach(c=>{const opt=document.createElement('option');opt.value=c;opt.textContent=c;selectCarpeta.appendChild(opt);});
}).catch(()=>{});
btnSave.addEventListener('click',()=>{
  systemPrompt=promptEditor.value.trim();
  promptStatus.textContent='Guardado';promptStatus.style.opacity='1';
  setTimeout(()=>{promptStatus.style.opacity='0';},2000);
});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
function usarSugerencia(b){
  const icon=b.querySelector('.suggestion-icon');
  const texto=b.textContent.replace(icon?icon.textContent:'','').trim();
  input.value=texto;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';input.focus();
}
function addMsg(texto,role){
  if(primeraVez){welcome.style.display='none';chat.style.display='flex';chat.style.flexDirection='column';primeraVez=false;}
  const wrapper=document.createElement('div');wrapper.className='msg-wrapper';
  const roleLabel=document.createElement('div');roleLabel.className='msg-role '+(role==='user'?'user-role':'');
  roleLabel.textContent=role==='user'?'Tu':'Segundo Cerebro';
  const body=document.createElement('div');body.className='msg-body '+role;
  if(role==='bot'&&texto==='...'){
    body.className+=' pensando';const spinner=document.createElement('div');spinner.className='spinner';
    body.appendChild(spinner);body.appendChild(document.createTextNode('Pensando...'));
  }else if(role==='bot'){body.innerHTML=marked.parse(texto);}else{body.textContent=texto;}
  wrapper.appendChild(roleLabel);wrapper.appendChild(body);chat.appendChild(wrapper);chat.scrollTop=chat.scrollHeight;
  return{wrapper,body};
}
function addFuentes(wrapper,fuentes,fuentesZotero){
  if(!fuentes.length&&!fuentesZotero.length)return;
  const wrap=document.createElement('div');wrap.className='fuentes';
  fuentes.forEach(f=>{const tag=document.createElement('span');tag.className='fuente-tag fuente-obsidian';tag.title=f;tag.textContent='📝 '+f;wrap.appendChild(tag);});
  fuentesZotero.forEach(f=>{const tag=document.createElement('span');tag.className='fuente-tag fuente-zotero';tag.title=f;tag.textContent='📄 '+f;wrap.appendChild(tag);});
  wrapper.appendChild(wrap);
}
async function enviar(){
  const texto=input.value.trim();if(!texto||btn.disabled)return;
  input.value='';input.style.height='auto';btn.disabled=true;
  addMsg(texto,'user');historial.push({role:'user',content:texto});
  const{wrapper:wBot,body:bBot}=addMsg('...','bot');
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pregunta:texto,carpeta:selectCarpeta.value||null,historial:historial.slice(-10),system_prompt:systemPrompt})});
    const data=await res.json();const respuesta=data.respuesta||data.error||'Sin respuesta';
    bBot.className='msg-body bot';bBot.innerHTML=marked.parse(respuesta);
    addFuentes(wBot,data.fuentes||[],data.fuentes_zotero||[]);
    historial.push({role:'assistant',content:respuesta});
  }catch(e){bBot.className='msg-body bot';bBot.textContent='Error conectando con la API.';}
  btn.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;
}
btn.addEventListener('click',enviar);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}});
checkHealth();
</script>
</body>
</html>
